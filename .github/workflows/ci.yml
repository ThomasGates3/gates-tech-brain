name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    # Pinned: Playwright 1.56 doesn't support the newer Ubuntu that ubuntu-latest points to.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Stand-in values only. The app is built and run with no real database, keys or webhooks.
    env:
      AUTH_SECRET: ci-only-secret
      CRON_SECRET: ci-only-cron
      FIELD_THOMAS_PASSWORD: ci-only-thomas
      ACCESS_PASSWORD: ci-only-team
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
